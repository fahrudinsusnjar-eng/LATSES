name: LAT-CES Verification Pipeline

on:
  workflow_dispatch:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  verify-core:
    runs-on: ubuntu-latest

    steps:
    - name: Preuzimanje koda (Checkout)
      uses: actions/checkout@v3

    - name: Podešavanje Python okruženja
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instalacija zavisnosti
      run: |
        python -m pip install --upgrade pip
        pip install pytest

    - name: Pokretanje LAT-CES Verifikacijskih Testova (0001 - 0009)
      run: |
        pytest
