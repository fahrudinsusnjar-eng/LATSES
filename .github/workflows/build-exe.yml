name: LATSES Windows Executable

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.10'

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26

      - name: Setup Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install package and build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pyinstaller

      - name: Build LATSES.exe
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --name LATSES lat_ces/cli.py

      - name: Smoke test executable
        shell: pwsh
        run: |
          & .\dist\LATSES.exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item .\dist\LATSES.exe .\release\LATSES.exe
          Get-FileHash .\release\LATSES.exe -Algorithm SHA256 | Format-List

      - name: Upload LATSES.exe artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: LATSES-Windows-x64
          path: release/LATSES.exe
          if-no-files-found: error
          retention-days: 30
