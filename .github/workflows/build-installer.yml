name: LAT-CES Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26

      - name: Setup Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c
        with:
          python-version: '3.10'

      - name: Install package and build tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest pyinstaller

      - name: Verify desktop application imports
        shell: pwsh
        run: |
          python -c "import lat_ces.gui; print('LAT-CES GUI import OK')"
          pytest -q

      - name: Build GUI executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name LATSES lat_ces/gui.py

      - name: Smoke test packaged executable
        shell: pwsh
        run: |
          if (!(Test-Path '.\dist\LATSES.exe')) { throw 'LATSES.exe was not created' }
          $size = (Get-Item '.\dist\LATSES.exe').Length
          if ($size -lt 1000000) { throw "LATSES.exe is unexpectedly small: $size bytes" }
          Write-Host "LATSES.exe size: $size bytes"

      - name: Build standard Windows installer
        shell: pwsh
        run: |
          $iscc = @(
            '${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe',
            '${env:ProgramFiles}\Inno Setup 6\ISCC.exe'
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw 'Inno Setup 6 compiler not found on runner' }
          & $iscc 'installer\LATSES.iss'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item '.\installer\installer-output\LAT-CES-Setup.exe' '.\release\LAT-CES-Setup.exe'
          Get-FileHash '.\release\LAT-CES-Setup.exe' -Algorithm SHA256 | Format-List

      - name: Upload standard installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: LAT-CES-Windows-Installer
          path: release/LAT-CES-Setup.exe
          if-no-files-found: error
          retention-days: 30
