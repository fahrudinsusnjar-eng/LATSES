[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lat-ses-agent"
version = "0.1.0"
description = "A minimal agent scaffold for the LATSES repository"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[tool.setuptools]
packages = ["lat_ses", "lat_ces", "lat_ces.core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
